        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Note: TopNavBar and SideNavBar are suppressed on transactional pages like Login -->
<main class="w-full max-w-[1200px] h-[800px] max-h-[921px] bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/30 flex overflow-hidden">
<!-- Left Side: Hero Image & Branding -->
<div class="hidden lg:flex w-1/2 relative bg-surface-variant flex-col justify-between overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A breathtaking, wide-angle photograph of an adventurous traveler looking out over a pristine, sunlit mountain range at dawn. The lighting is soft and golden, creating a sense of hope, calm, and security. The scene is majestic and professional, reinforcing trust and global exploration. The color palette incorporates subtle cool blues and warm emerald undertones, matching a modern corporate travel aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDqtE2FDt-BfG4nYtykxGWxgijyuofu4GTK5ZVdTxzCnsR8lFA2VQfkvkKNGUCGMXpRB9sKmT-dtFeCjwv0mO9NTUg_B3oXez7z5Owxt-wo78Nh3NcL96zvt58MSOZiSDddllM06AUGUQ5Q6lTq7d-d3ddbnQq1RkgM44YB-geN6xyKb-sNn3m6O-8ane-Q7Z8HmB4p6YDX3RR8E0pE9hAT_w1j6A72Do0EbgZjzyPtwvFqa2-dYG3O')"></div>
<!-- Dark gradient overlay for text readability -->
<div class="absolute inset-0 bg-gradient-to-t from-primary/80 via-primary/30 to-transparent"></div>
<div class="relative z-10 p-10 mt-auto">
<h1 class="font-headline-xl text-headline-xl text-on-primary mb-4">SecureVoyage</h1>
<p class="font-headline-md text-headline-md text-on-primary/90">Your Companion for Safe Travels</p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full lg:w-1/2 p-8 md:p-16 flex flex-col justify-center bg-surface-container-lowest">
<div class="max-w-[400px] w-full mx-auto">
<div class="mb-10 text-center lg:text-left">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to access your safety dashboard.</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full h-12 pl-10 pr-4 rounded-lg border border-outline-variant bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline" id="email" placeholder="Enter your email" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full h-12 pl-10 pr-10 rounded-lg border border-outline-variant bg-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-secondary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-4 h-4 rounded border-outline-variant text-secondary focus:ring-secondary" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">Remember me</span>
</label>
<a class="font-label-md text-label-md text-secondary hover:text-secondary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
<!-- Sign In Button -->
<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-label-bold text-label-bold hover:bg-primary/90 transition-colors flex items-center justify-center gap-2 shadow-sm" type="submit">
                        Sign In
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<div class="mt-8">
<div class="relative flex items-center mb-6">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-outline">or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<div class="flex gap-4">
<button class="flex-1 h-12 bg-surface border border-outline-variant rounded-lg flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors font-label-md text-label-md text-on-surface" type="button">
<span class="material-symbols-outlined">android</span> Google
                        </button>
<button class="flex-1 h-12 bg-surface border border-outline-variant rounded-lg flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors font-label-md text-label-md text-on-surface" type="button">
<span class="material-symbols-outlined">file_download</span> Apple
                        </button>
</div>
</div>
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Don't have an account? <a class="font-label-md text-label-md text-secondary hover:text-secondary-fixed-dim transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
</div>
</main>
  <script src="app.js"></script>
</body></html>
